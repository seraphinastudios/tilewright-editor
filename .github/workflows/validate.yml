name: Editor validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: editor-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux native build dependencies
        run: tools/install-linux-native-deps.sh
      - name: Install pinned Rust quality tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          install -d "${RUNNER_TEMP}/tools/cargo-deny" "${RUNNER_TEMP}/tools/cargo-auditable" "${RUNNER_TEMP}/bin"
          curl --fail --silent --show-error --location https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz --output "${RUNNER_TEMP}/cargo-deny.tar.gz"
          printf '%s  %s\n' 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f "${RUNNER_TEMP}/cargo-deny.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/cargo-deny.tar.gz" -C "${RUNNER_TEMP}/tools/cargo-deny" --strip-components=1
          install "${RUNNER_TEMP}/tools/cargo-deny/cargo-deny" "${RUNNER_TEMP}/bin/cargo-deny"
          curl --fail --silent --show-error --location https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.5/cargo-auditable-x86_64-unknown-linux-gnu.tar.xz --output "${RUNNER_TEMP}/cargo-auditable.tar.xz"
          printf '%s  %s\n' 322eda09f24e5dba97371c6c2c6949569c411ddf893852e88135cc5b51d5a719 "${RUNNER_TEMP}/cargo-auditable.tar.xz" | sha256sum --check --strict
          tar -xJf "${RUNNER_TEMP}/cargo-auditable.tar.xz" -C "${RUNNER_TEMP}/tools/cargo-auditable" --strip-components=1
          install "${RUNNER_TEMP}/tools/cargo-auditable/cargo-auditable" "${RUNNER_TEMP}/bin/cargo-auditable"
          curl --fail --silent --show-error --location https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz --output "${RUNNER_TEMP}/syft.tar.gz"
          printf '%s  %s\n' bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788 "${RUNNER_TEMP}/syft.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}/bin" syft
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
      - run: cargo fetch --locked
      - name: Prepare immutable font data explicitly
        run: python3 tools/prepare-font-pack.py prepare --acquire --output "${RUNNER_TEMP}/unicode-font-pack"
      - run: tools/validate.sh
        env:
          TILEWRIGHT_PREPARED_FONT_PACK: ${{ runner.temp }}/unicode-font-pack

  windows:
    name: Windows build, tests, and package
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: cargo fetch --locked
      - name: Prepare immutable font data explicitly
        shell: pwsh
        run: python tools/prepare-font-pack.py prepare --acquire --output "$env:RUNNER_TEMP/unicode-font-pack"
      - run: cargo test --locked --workspace --all-targets
      - name: Install pinned packaging tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_windows_amd64.zip -OutFile "$env:RUNNER_TEMP/syft.zip"
          if ((Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/syft.zip").Hash.ToLowerInvariant() -ne "815ee6973ec5dff6a671d7f41b0e78835a8c45b91d5a39f4743ea1cee833d3be") { throw "Syft digest mismatch" }
          Expand-Archive "$env:RUNNER_TEMP/syft.zip" "$env:RUNNER_TEMP/syft"
          "$env:RUNNER_TEMP/syft" | Out-File -FilePath $env:GITHUB_PATH -Append
          Invoke-WebRequest https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.5/cargo-auditable-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP/cargo-auditable.zip"
          if ((Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/cargo-auditable.zip").Hash.ToLowerInvariant() -ne "83a7d5955c7ac96ede5d896ac9ede5f7ecce9ece0e95d9e47acd766b09e2ef1b") { throw "cargo-auditable digest mismatch" }
          Expand-Archive "$env:RUNNER_TEMP/cargo-auditable.zip" "$env:RUNNER_TEMP/cargo-auditable"
          "$env:RUNNER_TEMP/cargo-auditable" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Package dry run
        shell: pwsh
        run: tools/package-windows.ps1 -Output dist -Version 0.1.0-test.1 -FontPack "$env:RUNNER_TEMP/unicode-font-pack"

  aggregate:
    name: Editor validation
    if: always()
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "${LINUX_RESULT}" = success -a "${WINDOWS_RESULT}" = success
