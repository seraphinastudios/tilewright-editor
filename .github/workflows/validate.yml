name: Editor validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: editor-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# The Linux jobs each run one stage of tools/validate.sh; together they run
# all of it, as it runs locally with no argument.
jobs:
  checks:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux native build dependencies
        run: tools/install-linux-native-deps.sh
      - name: Install pinned Rust quality tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          tools/install-linux-ci-tools.sh "${RUNNER_TEMP}" cargo-deny
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
      - run: cargo fetch --locked
      - name: Prepare immutable font data explicitly
        run: python3 tools/prepare-font-pack.py prepare --acquire --output "${RUNNER_TEMP}/unicode-font-pack"
      - run: tools/validate.sh checks
        env:
          TILEWRIGHT_PREPARED_FONT_PACK: ${{ runner.temp }}/unicode-font-pack

  tests:
    name: Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux native build dependencies
        run: tools/install-linux-native-deps.sh
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: cargo fetch --locked
      - name: Prepare immutable font data explicitly
        run: python3 tools/prepare-font-pack.py prepare --acquire --output "${RUNNER_TEMP}/unicode-font-pack"
      - run: tools/validate.sh tests
        env:
          TILEWRIGHT_PREPARED_FONT_PACK: ${{ runner.temp }}/unicode-font-pack

  package:
    name: Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux native build dependencies
        run: tools/install-linux-native-deps.sh
      - name: Install pinned packaging tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          tools/install-linux-ci-tools.sh "${RUNNER_TEMP}" cargo-auditable syft
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
      - run: cargo fetch --locked
      - name: Prepare immutable font data explicitly
        run: python3 tools/prepare-font-pack.py prepare --acquire --output "${RUNNER_TEMP}/unicode-font-pack"
      - run: tools/validate.sh package
        env:
          TILEWRIGHT_PREPARED_FONT_PACK: ${{ runner.temp }}/unicode-font-pack

  windows-package:
    name: Windows package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: cargo fetch --locked
      - name: Prepare immutable font data explicitly
        shell: pwsh
        run: python tools/prepare-font-pack.py prepare --acquire --output "$env:RUNNER_TEMP/unicode-font-pack"
      - name: Install pinned packaging tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_windows_amd64.zip -OutFile "$env:RUNNER_TEMP/syft.zip"
          if ((Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/syft.zip").Hash.ToLowerInvariant() -ne "815ee6973ec5dff6a671d7f41b0e78835a8c45b91d5a39f4743ea1cee833d3be") { throw "Syft digest mismatch" }
          Expand-Archive "$env:RUNNER_TEMP/syft.zip" "$env:RUNNER_TEMP/syft"
          "$env:RUNNER_TEMP/syft" | Out-File -FilePath $env:GITHUB_PATH -Append
          Invoke-WebRequest https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.5/cargo-auditable-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP/cargo-auditable.zip"
          if ((Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/cargo-auditable.zip").Hash.ToLowerInvariant() -ne "83a7d5955c7ac96ede5d896ac9ede5f7ecce9ece0e95d9e47acd766b09e2ef1b") { throw "cargo-auditable digest mismatch" }
          Expand-Archive "$env:RUNNER_TEMP/cargo-auditable.zip" "$env:RUNNER_TEMP/cargo-auditable"
          "$env:RUNNER_TEMP/cargo-auditable" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Package dry run
        shell: pwsh
        run: tools/package-windows.ps1 -Output dist -Version 0.1.0-test.1 -FontPack "$env:RUNNER_TEMP/unicode-font-pack"

  # tools/test_validation_font_input.py reads this job up to `aggregate:`.
  windows:
    name: Windows tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: cargo fetch --locked
      - name: Prepare immutable font data explicitly
        shell: pwsh
        run: python tools/prepare-font-pack.py prepare --acquire --output "$env:RUNNER_TEMP/unicode-font-pack"
      # The Windows tests gain little from optimised dependencies, and the
      # Windows build takes minutes longer with them: build as main did.
      - run: cargo test --locked --workspace --all-targets --config 'profile.dev.package."*".opt-level=0' --config 'profile.dev.package."*".debug=true'
        env:
          TILEWRIGHT_UNICODE_FONT_ROOT: ${{ runner.temp }}/unicode-font-pack

  aggregate:
    name: Editor validation
    if: always()
    needs: [checks, tests, package, windows-package, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Every job must succeed: a failed, cancelled or skipped job fails this one,
      # and the count stops an empty or shortened needs list from passing.
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e 'length == 5 and all(.[]; .result == "success")' <<<"${NEEDS}" ||
            { echo "not every validation job succeeded:" >&2; jq -r 'to_entries[] | "\(.key): \(.result)"' <<<"${NEEDS}" >&2; exit 1; }
