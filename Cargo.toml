[workspace]
members = [
  "crates/tilewright-editor-app",
  "crates/tilewright-editor-commands",
  "crates/tilewright-editor-document",
  "crates/tilewright-editor-mcp",
  "crates/tilewright-editor-mcp-sandbox",
  "crates/tilewright-editor-observe",
  "crates/tilewright-editor-preview",
  "crates/tilewright-editor-project",
  "crates/tilewright-editor-proposal",
  "crates/tilewright-editor-recovery",
  "crates/tilewright-editor-sandbox",
  "crates/tilewright-editor-testkit",
  "crates/tilewright-editor-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/seraphinastudios/tilewright-editor"

[workspace.dependencies]
tilewright-editor-commands = { path = "crates/tilewright-editor-commands", version = "=0.1.0" }
tilewright-editor-document = { path = "crates/tilewright-editor-document", version = "=0.1.0" }
tilewright-editor-mcp = { path = "crates/tilewright-editor-mcp", version = "=0.1.0" }
tilewright-editor-mcp-sandbox = { path = "crates/tilewright-editor-mcp-sandbox", version = "=0.1.0" }
tilewright-editor-observe = { path = "crates/tilewright-editor-observe", version = "=0.1.0" }
tilewright-editor-preview = { path = "crates/tilewright-editor-preview", version = "=0.1.0" }
tilewright-editor-project = { path = "crates/tilewright-editor-project", version = "=0.1.0" }
tilewright-editor-proposal = { path = "crates/tilewright-editor-proposal", version = "=0.1.0" }
tilewright-editor-recovery = { path = "crates/tilewright-editor-recovery", version = "=0.1.0" }
tilewright-editor-sandbox = { path = "crates/tilewright-editor-sandbox", version = "=0.1.0" }
tilewright-editor-testkit = { path = "crates/tilewright-editor-testkit", version = "=0.1.0" }
tilewright-editor-ui = { path = "crates/tilewright-editor-ui", version = "=0.1.0" }
tilewright-edit = "=0.2.2"
tilewright-jsonc = "=0.2.2"
tilewright-render-api = "=0.7.2"
tilewright-render-world = "=0.7.2"
tilewright-render-wgpu = "=0.7.2"
tilewright-render-sdl3 = "=0.7.2"
tilewright-render-resources = "=0.7.2"
tilewright-render-testkit = "=0.7.2"
tilewright-render-ui = "=0.7.2"
tilewright-scene = "=0.7.2"
tilewright-source = "=0.2.2"
tilewright-ui = "=0.1.3"
tilewright-ui-render = "=0.1.3"
sha2 = "0.11.0"
serde_json = "1.0.145"
png = "0.18.1"
pollster = "1.0.1"
tempfile = "3.27.0"
sdl3 = { version = "0.22.1", default-features = false, features = ["build-from-source-static"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Tests and `cargo run` use the dev profile. Optimise dependencies (not the
# workspace's own crates) so the editor's scripted tests run in seconds, not
# minutes, and keep only their line tables, which backtraces need, so they
# build and link quickly. `"*"` takes precedence over `build-override`, so
# dependencies' build scripts and proc macros get these settings too. Debug
# assertions and overflow checks stay on, and Rust has no fast-math, so
# results are the same; release builds are not affected. To step through
# dependencies with full debug information, build them as before:
#   cargo test --config 'profile.dev.package."*".opt-level=0' --config 'profile.dev.package."*".debug=true'
[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# sdl3-sys builds SDL from source with CMake, which takes its build type and
# debug flags from this profile: keep SDL's debug build as it was. This also
# reaches the metadata-only sdl3-sys that sdl3's build script uses; the files
# that build script generates are unchanged.
[profile.dev.package.sdl3-sys]
opt-level = 0
debug = true
